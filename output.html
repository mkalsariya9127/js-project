<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student Information Card</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <div class="card container">
        <div class="student-card" id="studentcard">
            <img src="https://picsum.photos/200" alt="student photo" class="student-photo">
            <h2 id="cardName">Student Name</h2>
            <p id="cardRoll">Roll No: --</p>
            <p id="cardEmail">Email: --</p>
            <p id="cardMobile">Mobile Number: --</p>
            <p id="cardAge">Age: --</p>
            <p id="cardGender">Gender: --</p>
            <p id="cardCourse">Course: --</p>
            <p id="cardMarks">Marks: --</p>
            <br>
            <a href="index.html">Back to Form</a>
        </div>
    </div>
    <script src="script.js"></script>
</body>

</html>
